<title id="ArcherTower-title">Archer tower</title><desc id="ArcherTower-desc">A green-hooded ranger drawing an arrow, with a recurved wooden bow, feathered quiver, leather bracer, cloak and boots. Three-quarter view, aiming right. Original vector artwork.</desc><defs><linearGradient id="ArcherTower-skin" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#ffe1a5"/><stop offset="0.500" stop-color="#ecae72"/><stop offset="1.000" stop-color="#c77547"/></linearGradient><linearGradient id="ArcherTower-hair" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#785033"/><stop offset="0.500" stop-color="#4c3025"/><stop offset="1.000" stop-color="#2b2325"/></linearGradient><linearGradient id="ArcherTower-leather" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#bc7c40"/><stop offset="0.500" stop-color="#875029"/><stop offset="1.000" stop-color="#593221"/></linearGradient><linearGradient id="ArcherTower-wood" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#dca45c"/><stop offset="0.500" stop-color="#a86b36"/><stop offset="1.000" stop-color="#6d3c23"/></linearGradient><linearGradient id="ArcherTower-steel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#e4f3f2"/><stop offset="0.500" stop-color="#89adb9"/><stop offset="1.000" stop-color="#4f6a82"/></linearGradient><linearGradient id="ArcherTower-gold" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fff1a0"/><stop offset="0.500" stop-color="#ebc04f"/><stop offset="1.000" stop-color="#b57929"/></linearGradient><linearGradient id="ArcherTower-ivory" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fffae1"/><stop offset="0.500" stop-color="#ecdfb7"/><stop offset="1.000" stop-color="#c6aa7b"/></linearGradient><linearGradient id="ArcherTower-greenCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#89bb72"/><stop offset="0.500" stop-color="#497b4c"/><stop offset="1.000" stop-color="#315540"/></linearGradient></defs>
