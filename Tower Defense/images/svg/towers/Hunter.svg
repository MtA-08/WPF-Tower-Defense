<title id="HunterTower-title">Hunter tower with cast net</title><desc id="HunterTower-desc">A chibi hunter in a broad-brimmed olive hat and leather waistcoat holding a knotted weighted cast net ready to throw. Three-quarter view facing right. Original editable vector artwork.</desc><defs><linearGradient id="HunterTower-skin" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#ffe1a5"/><stop offset="0.500" stop-color="#ecae72"/><stop offset="1.000" stop-color="#c77547"/></linearGradient><linearGradient id="HunterTower-hair" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#785033"/><stop offset="0.500" stop-color="#4c3025"/><stop offset="1.000" stop-color="#2b2325"/></linearGradient><linearGradient id="HunterTower-leather" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#bc7c40"/><stop offset="0.500" stop-color="#875029"/><stop offset="1.000" stop-color="#593221"/></linearGradient><linearGradient id="HunterTower-ivory" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fffae1"/><stop offset="0.500" stop-color="#ecdfb7"/><stop offset="1.000" stop-color="#c6aa7b"/></linearGradient><linearGradient id="HunterTower-greenCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#89bb72"/><stop offset="0.500" stop-color="#497b4c"/><stop offset="1.000" stop-color="#315540"/></linearGradient><linearGradient id="HunterTower-oliveCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#b7c486"/><stop offset="0.500" stop-color="#788c53"/><stop offset="1.000" stop-color="#50613f"/></linearGradient><linearGradient id="HunterTower-redCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#f29862"/><stop offset="0.500" stop-color="#be6542"/><stop offset="1.000" stop-color="#7e4334"/></linearGradient><linearGradient id="HunterTower-gold" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fff1a0"/><stop offset="0.500" stop-color="#ebc04f"/><stop offset="1.000" stop-color="#b5792