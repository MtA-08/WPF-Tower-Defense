<title id="CavemanTower-title">Caveman tower</title><desc id="CavemanTower-desc">A chibi caveman with tousled hair, animal-hide tunic, pebble pouch and primitive wooden slingshot. Three-quarter view, aiming right. Original vector artwork.</desc><defs><linearGradient id="CavemanTower-skin" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#ffe1a5"/><stop offset="0.500" stop-color="#ecae72"/><stop offset="1.000" stop-color="#c77547"/></linearGradient><linearGradient id="CavemanTower-hair" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#785033"/><stop offset="0.500" stop-color="#4c3025"/><stop offset="1.000" stop-color="#2b2325"/></linearGradient><linearGradient id="CavemanTower-leather" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#bc7c40"/><stop offset="0.500" stop-color="#875029"/><stop offset="1.000" stop-color="#593221"/></linearGradient><linearGradient id="CavemanTower-wood" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#dca45c"/><stop offset="0.500" stop-color="#a86b36"/><stop offset="1.000" stop-color="#6d3c23"/></linearGradient><linearGradient id="CavemanTower-stone" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#cad4d8"/><stop offset="0.500" stop-color="#8c9da9"/><stop offset="1.000" stop-color="#5e7386"/></linearGradient><linearGradient id="CavemanTower-ivory" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fffae1"/><stop offset="0.500" stop-color="#ecdfb7"/><stop offset="1.000" stop-color="#c6aa7b"/></linearGradient><linearGradient id="CavemanTower-orangeCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#f5bf6b"/><stop offset="0.500" stop-color="#d68e3c"/><stop offset="1.000" stop-color="#9e582b"/></linearGradient></defs>
