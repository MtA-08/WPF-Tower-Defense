<title id="SniperBulletProjectile-title">Sniper bullet projectile</title><desc id="SniperBulletProjectile-desc">An elongated right-facing match bullet with a boat tail, gold-copper jacket and pointed dark-steel nose. Bullet only, without cartridge case or motion trail. Original vector artwork.</desc><defs><linearGradient id="SniperBulletProjectile-darkSteel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#657c8c"/><stop offset="0.500" stop-color="#394c60"/><stop offset="1.000" stop-color="#253142"/></linearGradient><linearGradient id="SniperBulletProjectile-brass" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fff0a2"/><stop offset="0.500" stop-color="#c99447"/><stop offset="1.000" stop-color="#87622f"/></linearGradient><linearGradient id="SniperBulletProjectile-copper" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#ffc78b"/><stop offset="0.500" stop-color="#d68951"/><stop offset="1.000" stop-color="#a75637"/></linearGradient></defs>
