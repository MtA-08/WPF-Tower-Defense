<title id="SniperTower-title">Sniper tower</title><desc id="SniperTower-desc">A concealed ranger with a layered teal ghillie hood, leafy cape, leather field gear and a long green scoped rifle. Three-quarter view, aiming right. Original vector artwork.</desc><defs><linearGradient id="SniperTower-skin" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#ffe1a5"/><stop offset="0.500" stop-color="#ecae72"/><stop offset="1.000" stop-color="#c77547"/></linearGradient><linearGradient id="SniperTower-leather" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#bc7c40"/><stop offset="0.500" stop-color="#875029"/><stop offset="1.000" stop-color="#593221"/></linearGradient><linearGradient id="SniperTower-wood" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#dca45c"/><stop offset="0.500" stop-color="#a86b36"/><stop offset="1.000" stop-color="#6d3c23"/></linearGradient><linearGradient id="SniperTower-steel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#e4f3f2"/><stop offset="0.500" stop-color="#89adb9"/><stop offset="1.000" stop-color="#4f6a82"/></linearGradient><linearGradient id="SniperTower-darkSteel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#657c8c"/><stop offset="0.500" stop-color="#394c60"/><stop offset="1.000" stop-color="#253142"/></linearGradient><linearGradient id="SniperTower-greenCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#89bb72"/><stop offset="0.500" stop-color="#497b4c"/><stop offset="1.000" stop-color="#315540"/></linearGradient><linearGradient id="SniperTower-tealCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#76bdae"/><stop offset="0.500" stop-color="#43887c"/><stop offset="1.000" stop-color="#2c5b59"/></linearGradient><linearGradient id="SniperTower-brass" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fff0a2"/><stop offset="0.500" stop-color="#c99447"/><stop offset="1.000" stop-color="#87622f"/></linearGradient></d