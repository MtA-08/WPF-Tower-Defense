<title id="GunmanTower-title">Gunman tower</title><desc id="GunmanTower-desc">A blue-uniformed gunner with bronze goggles, red neck scarf, ammunition belt, padded boots and a compact wood-stock carbine. Three-quarter view, aiming right. Original vector artwork.</desc><defs><linearGradient id="GunmanTower-skinDark" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#eeb781"/><stop offset="0.500" stop-color="#c7824d"/><stop offset="1.000" stop-color="#985134"/></linearGradient><linearGradient id="GunmanTower-leather" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#bc7c40"/><stop offset="0.500" stop-color="#875029"/><stop offset="1.000" stop-color="#593221"/></linearGradient><linearGradient id="GunmanTower-wood" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#dca45c"/><stop offset="0.500" stop-color="#a86b36"/><stop offset="1.000" stop-color="#6d3c23"/></linearGradient><linearGradient id="GunmanTower-steel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#e4f3f2"/><stop offset="0.500" stop-color="#89adb9"/><stop offset="1.000" stop-color="#4f6a82"/></linearGradient><linearGradient id="GunmanTower-darkSteel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#657c8c"/><stop offset="0.500" stop-color="#394c60"/><stop offset="1.000" stop-color="#253142"/></linearGradient><linearGradient id="GunmanTower-gold" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fff1a0"/><stop offset="0.500" stop-color="#ebc04f"/><stop offset="1.000" stop-color="#b57929"/></linearGradient><linearGradient id="GunmanTower-redCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#fa8062"/><stop offset="0.500" stop-color="#c94842"/><stop offset="1.000" stop-color="#7e3034"/></linearGradient><linearGradient id="GunmanTower-blueCloth" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0.000" stop-color="#86b3ce"/><stop offset="0.500" stop-color="#477494"/><stop offset="1.000" stop-color="#314a64"/></linearG